<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Redes Sociais</title>
</head>
<body>
<div class="main">
<h1 data-animate>Guilherme Sch<span class="typing-area"><span class="typing-text">osek da Silva</span></span></h1>
    <p>Bem-vindo à minha página de redes sociais!
        Clique nos icones abaixo para acessar minhas redes.
    </p>

<nav class="social-links">

    <a
        class="social-link"
        href="https://instagram.com/loowgui"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Acessar meu Instagram"
        data-social="instagram"
    >
        <img src="./assets/instagram.svg" alt="Instagram">
    </a>

    <a
        class="social-link"
        href="https://tiktok.com/@guisck"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Acessar meu TikTok"
        data-social="tiktok"
    >
        <img src="./assets/tiktok.svg" alt="TikTok">
    </a>

    <a
        class="social-link"
        href="https://www.linkedin.com/in/guilherme-schosek-79289437a/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Acessar meu LinkedIn"
        data-social="linkedin"
    >
        <img src="./assets/linkedin.svg" alt="LinkedIn">
    </a>

    <a
        class="social-link"
        href="https://github.com/schosek"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Acessar meu GitHub"
        data-social="github"
    >
        <img src="./assets/github.svg" alt="GitHub">
    </a>

</nav>
</body>
</html>
